name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        edition: [standard, zeekr]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: |
          python3 scripts/check_public_tree.py
          python3 -m unittest discover -s scripts/tests -p 'test_public_tree.py'
          python3 scripts/sync_zeekr_branding.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew -Pdiplay.edition=${{ matrix.edition }} :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Verify edition contents
        run: python3 scripts/verify_edition_apk.py mobile/build/outputs/apk/debug/mobile-debug.apk --edition ${{ matrix.edition }}
      - name: Standalone vehicle probe checks
        if: matrix.edition == 'zeekr'
        run: |
          ./gradlew :vehicleprobe:testDebugUnitTest :vehicleprobe:lintDebug :vehicleprobe:assembleDebug
          python3 scripts/verify_vehicle_probe_apk.py vehicleprobe/build/outputs/apk/debug/vehicleprobe-debug.apk
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.edition }}
          path: |
            vehicleprobe/build/reports/probe-dashboard/
            vehicleprobe/build/reports/tests/
            vehicleprobe/build/reports/lint-results-debug.html
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            common/build/reports/navigation-focus-ui/
            common/build/reports/zeekr-vehicle-ui/
            common/build/reports/zeekr-settings-ui/
            common/build/reports/zeekr-hmi-states/
            common/build/reports/zeekr-auxiliary-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
